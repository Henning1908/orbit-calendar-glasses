plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.henning1908.orbitcalendar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.henning1908.orbitcalendar'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.2.0'
        manifestPlaceholders = [
            mwdat_application_id: localProperties.getProperty('mwdat_application_id', ''),
            mwdat_client_token: localProperties.getProperty('mwdat_client_token', '')
        ]
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'com.meta.wearable:mwdat-core:1.0.1'
    implementation 'com.meta.wearable:mwdat-display:1.0.1'
}
