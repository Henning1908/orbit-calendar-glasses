<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111d" />
    <meta name="description" content="A calm, read-only calendar for the web and supported Meta display glasses. Connect ICS or CalDAV and refresh automatically." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orbit Calendar — your calendar, in one clear glance" />
    <meta property="og:description" content="A calm, read-only calendar for the web and supported Meta display glasses." />
    <meta property="og:image" content="https://orbit-calendar.henning-orbit-calendar.workers.dev/images/orbit-hero.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/meta-display-apps-app-icon-512-v3.png" />
    <script>
      if (location.hostname === 'orbit-calendar-glasses.onrender.com') {
        location.replace(`https://orbit-calendar.henning-orbit-calendar.workers.dev${location.pathname}${location.search}${location.hash}`)
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Orbit Calendar</title>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen">
        <p class="boot-kicker">ORBIT / GLANCE MODE</p>
        <h1>Orbit Calendar</h1>
        <p>Loading calendar…</p>
        <noscript>
          <p>JavaScript must be enabled to use the interactive calendar.</p>
        </noscript>
      </main>
    </div>
    <style>
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 32px;
        color: #f8fbff;
        background: #020613;
        font-family: system-ui, sans-serif;
      }
      .boot-screen h1,
      .boot-screen p {
        margin: 0;
      }
      .boot-screen h1 {
        font-size: clamp(2.4rem, 8vw, 4.5rem);
      }
      .boot-kicker {
        color: #66d8ff;
        font-weight: 700;
        letter-spacing: .16em;
      }
      .boot-screen noscript {
        color: #ee6d8b;
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
