      <text x="0" y="216" fill="#f7fbff" font-size="67" font-weight="700" letter-spacing="-3">in one clear glance.</text>
      <text x="4" y="267" fill="#b4c7dc" font-size="22">A calm view for the web and Meta display glasses.</text>
