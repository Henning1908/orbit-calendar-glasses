    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b3653"/><stop offset="1" stop-color="#101c30"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
