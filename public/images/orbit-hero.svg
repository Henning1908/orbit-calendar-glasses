<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Orbit Calendar</title>
  <desc id="desc">A clear calendar view for your browser and display glasses.</desc>
  <defs>
