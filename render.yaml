services:
  - type: web
    name: orbit-calendar-glasses
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    disk:
      name: orbit-calendar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ORBIT_STORAGE_KEY
        generateValue: true
